name: Bug report
description: Crash, wrong output, or unexpected rule behaviour
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please run `python3 isg.py . --format json` first to confirm it reproduces.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual output versus expected output
      placeholder: Expected a clean scan, got ISG00X, but this script is safe because...
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Triggering script (redacted)
      description: Only the relevant lines. Remove real domains, tokens and IPs.
      render: bash
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command and output
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: isg version
      description: Output of `python3 isg.py --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS and Python version
      placeholder: Windows 11 / Python 3.12.5
    validations:
      required: true
