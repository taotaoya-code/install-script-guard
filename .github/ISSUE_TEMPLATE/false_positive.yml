name: False positive
description: A rule flagged code that is actually safe
title: "[false-positive] ISG0XX "
labels: ["false positive"]
body:
  - type: markdown
    attributes:
      value: |
        False positives rank above misses here — enough of them and users disable the tool entirely. Please be specific about *why* the code is safe.
  - type: input
    id: rule
    attributes:
      label: Rule id
      placeholder: ISG003
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code that was flagged
      render: bash
    validations:
      required: true
  - type: textarea
    id: why-safe
    attributes:
      label: Why it is safe
      description: For example — this owner is a read-only mirror that will never be renamed, or verification already happened in the parent script
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested rule change
      description: Allowlist, severity downgrade, or a different detection condition?
