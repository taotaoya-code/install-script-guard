name: 规则建议
description: 提出一条新的检测规则
title: "[rule] "
labels: ["enhancement"]
body:
  - type: textarea
    id: risk
    attributes:
      label: 这条规则要防什么风险
      description: 最好附一个真实事故或真实脚本片段
    validations:
      required: true
  - type: textarea
    id: detection
    attributes:
      label: 怎么检测
      description: 大概的正则或判定条件；说明会误伤什么
      render: text
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 建议级别
      options: ["high", "medium", "low"]
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: 设计约束确认
      options:
        - label: 该规则可以用确定性方法实现（不依赖 LLM）
          required: true
        - label: 不需要引入第三方依赖
          required: true
        - label: 我理解需要同时提供「应命中」和「不应命中」两个测试
          required: true
