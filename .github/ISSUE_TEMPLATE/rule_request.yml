name: Rule proposal
description: Propose a new detection rule
title: "[rule] "
labels: ["enhancement"]
body:
  - type: textarea
    id: risk
    attributes:
      label: What risk does this rule cover
      description: Ideally attach a real incident or a real script fragment
    validations:
      required: true
  - type: textarea
    id: detection
    attributes:
      label: How to detect it
      description: Rough regex or condition; note what it might wrongly flag
      render: text
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Proposed severity
      options: ["high", "medium", "low"]
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      options:
        - label: This can be implemented deterministically (no LLM involved)
          required: true
        - label: No third-party dependencies are needed
          required: true
        - label: I understand both a "must match" and a "must not match" test are required
          required: true
