[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "install-script-guard"
version = "0.1.0"
description = "Deterministic supply-chain audit for one-line install scripts (curl | bash)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "taotaoya-code" }]
keywords = ["security", "supply-chain", "shell", "installer", "sarif", "ci", "linter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Unix Shell",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

[project.scripts]
isg = "isg:main"

[project.urls]
Homepage = "https://github.com/taotaoya-code/install-script-guard"

[tool.setuptools]
py-modules = ["isg"]
